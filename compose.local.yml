# compose.local.yml — self-contained local stack for dev and testing.
#
# Run it through scripts/local.sh (or `make local-up`), which checks the
# submodules and generates the dev signing key first.
#
# Unlike compose.yml, nothing here reads a .env or reaches Neon: Postgres and
# S3 run as containers, a one-shot `migrate` job creates the schemas, roles and
# tables, and every service gets fixed dev credentials. State lives in named
# volumes; `scripts/local.sh reset` drops them.
#
# Host ports default to a 2xxxx offset so this stack can run next to
# compose.yml (:3000/:8080/...) and scripts/e2e-up.sh (:1xxxx). Override any
# of them with the LOCAL_*_PORT variables. All bind 127.0.0.1 only.
#
#   web          http://localhost:23000   (nginx; /api/ -> coregateway-api)
#   gateway      http://localhost:28080
#   corefinance  http://localhost:26969
#   coredraw     http://localhost:26971
#   coreban      http://localhost:26972
#   postgres     localhost:25432          neondb_owner / owner, db coredb
#   S3           http://localhost:27070   versitygw, bucket coreban-attachments
name: coregateway-local

x-go-service: &go-service
  restart: unless-stopped
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    - net.ipv6.conf.default.disable_ipv6=1

secrets:
  jwt_private_key:
    # Generated by scripts/local.sh on first run. Dev-only, gitignored.
    file: ./.local/jwt.pem

volumes:
  pgdata:
  backups:
  s3data:
  gocache:

services:
  # ---------------------------------------------------------------- infra --
  postgres:
    # The gateway's first migration creates the pg_uuidv7 extension.
    image: ghcr.io/fboulnois/pg_uuidv7:1.6.0
    restart: unless-stopped
    environment:
      # neondb_owner: the bootstrap SQL in every repo grants as this role.
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: coredb
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d coredb"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: versity/versitygw:v1.0.17
    restart: unless-stopped
    command: ["--access", "coreban-local", "--secret", "coreban-local-secret", "--region", "us-east-1", "posix", "/data"]
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-27070}:7070"
    volumes:
      - s3data:/data

  # One-shot: create the attachment bucket and let the web upload to it
  # directly (presigned PUTs from the browser need CORS).
  s3-setup:
    image: amazon/aws-cli:2.22.0
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: coreban-local
      AWS_SECRET_ACCESS_KEY: coreban-local-secret
      AWS_REGION: us-east-1
      BUCKET: coreban-attachments
      ORIGIN: http://localhost:${LOCAL_WEB_PORT:-23000}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        s3="aws --endpoint-url http://s3:7070 s3api"
        for i in $$(seq 30); do $$s3 list-buckets >/dev/null 2>&1 && break; sleep 1; done
        $$s3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration "{\"CORSRules\":[{
          \"AllowedOrigins\":[\"$$ORIGIN\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],
          \"AllowedHeaders\":[\"content-type\"],\"ExposeHeaders\":[\"etag\",\"content-length\"],
          \"MaxAgeSeconds\":3600}]}"
        echo "bucket $$BUCKET ready"

  # One-shot: schemas, runtime roles and goose migrations for every service.
  # Idempotent, so it runs on every `up`. See scripts/local-migrate.sh.
  migrate:
    build:
      dockerfile_inline: |
        FROM golang:1.27-alpine
        RUN apk add --no-cache postgresql-client \
         && go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: neondb_owner
      PGPASSWORD: owner
      PGDATABASE: coredb
    volumes:
      - .:/src:ro
    command: ["sh", "/src/scripts/local-migrate.sh"]

  # ------------------------------------------------------------- services --
  coregateway-api:
    <<: *go-service
    build:
      context: .
      dockerfile: Dockerfile.coregateway-api
    ports:
      - "127.0.0.1:${LOCAL_GATEWAY_PORT:-28080}:8080"
    environment:
      DATABASE_URL: postgresql://coregateway_role:gwpw@postgres:5432/coredb?sslmode=disable
      # Owner connection, used only by pg_dump for backups (ADR-0006).
      MIGRATION_URL: postgresql://neondb_owner:owner@postgres:5432/coredb?sslmode=disable
      PORT: "8080"
      ENV: development
      # The web's own origin, plus `pnpm dev` (vite) pointed at this gateway.
      ALLOWED_ORIGINS: http://localhost:${LOCAL_WEB_PORT:-23000},http://localhost:5173
      COREFINANCE_URL: http://corefinance-api:6969
      COREDRAW_URL: http://coredraw-api:6971
      COREBAN_URL: http://coreban-api:6972
      ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@local.dev}
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-local-admin-pass-123}
      JWT_KID: local
      JWT_ISSUER: https://gateway.internal
      JWT_AUDIENCE: corefinance,coredraw,coreban
      JWT_TTL_SECONDS: "300"
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      GODEBUG: netdns=go
    secrets:
      - jwt_private_key
    volumes:
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/.well-known/jwks.json"]
      # Only startup needs this to be quick (downstreams wait on it), so poll
      # every 2s while starting and once a minute after.
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  corefinance-api:
    <<: *go-service
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-api
      target: api
    ports:
      - "127.0.0.1:${LOCAL_COREFINANCE_PORT:-26969}:6969"
    environment:
      DATABASE_URL: postgresql://corefinance_role:cfpw@postgres:5432/coredb?sslmode=disable
      PORT: "6969"
      ENV: development
      JWT_ISSUER: https://gateway.internal
      JWT_AUDIENCE: corefinance
      JWT_JWKS_URL: http://coregateway-api:8080/.well-known/jwks.json
      GODEBUG: netdns=go
    depends_on:
      coregateway-api:
        condition: service_healthy

  corefinance-cron-worker:
    <<: *go-service
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-cron-worker
      target: worker
    environment:
      DATABASE_URL: postgresql://corefinance_role:cfpw@postgres:5432/coredb?sslmode=disable
      ENV: development
      GODEBUG: netdns=go
    depends_on:
      migrate:
        condition: service_completed_successfully

  coredraw-api:
    <<: *go-service
    build:
      context: ./services/coredraw
      dockerfile: Dockerfile.coredraw-api
      target: api
    ports:
      - "127.0.0.1:${LOCAL_COREDRAW_PORT:-26971}:6971"
    environment:
      DATABASE_URL: postgresql://coredraw_role:cdpw@postgres:5432/coredb?sslmode=disable
      PORT: "6971"
      ENV: development
      JWT_ISSUER: https://gateway.internal
      JWT_AUDIENCE: coredraw
      JWT_JWKS_URL: http://coregateway-api:8080/.well-known/jwks.json
      GODEBUG: netdns=go
    depends_on:
      coregateway-api:
        condition: service_healthy

  coreban-api:
    <<: *go-service
    build:
      context: ./services/coreban
      dockerfile: Dockerfile.coreban-api
      target: api
    ports:
      - "127.0.0.1:${LOCAL_COREBAN_PORT:-26972}:6972"
    environment:
      DATABASE_URL: postgresql://coreban_role:cbpw@postgres:5432/coredb?sslmode=disable
      PORT: "6972"
      JWT_ISSUER: https://gateway.internal
      JWT_AUDIENCE: coreban
      JWT_JWKS_URL: http://coregateway-api:8080/.well-known/jwks.json
      # No ntfy locally: reminders are stored but not delivered.
      NTFY_URL: ""
      # coreban signs uploads for the browser, so the public endpoint is the
      # host port while coreban itself talks to S3 over the compose network.
      S3_ENDPOINT: http://s3:7070
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCAL_S3_PORT:-27070}
      S3_BUCKET: coreban-attachments
      S3_ACCESS_KEY_ID: coreban-local
      S3_SECRET_ACCESS_KEY: coreban-local-secret
      S3_REGION: us-east-1
      ATTACHMENT_QUOTA: 1GB
      GODEBUG: netdns=go
    depends_on:
      coregateway-api:
        condition: service_healthy
      s3-setup:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-23000}:80"
    depends_on:
      coregateway-api:
        condition: service_healthy
