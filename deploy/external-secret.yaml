# ExternalSecret: Vault -> K8s Secret for gateway JWT keys.
# Requires: external-secrets operator + a Vault ClusterSecretStore named
# `vault-backend` (K8s-auth). Adjust store name / paths to your setup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-jwt-keys
  namespace: coregateway
spec:
  # Poll Vault often enough that rotation propagates promptly; the
  # CronJob's JWKS polling tolerates the lag, Reloader handles restarts.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: gateway-jwt-keys
    creationPolicy: Owner
    # Reloader annotation (if Reloader is installed, it rolls the
    # gateway Deployment on every data change — no manual restarts):
    # template:
    #   metadata:
    #     annotations:
    #       reloader.stakater.com/auto: "true"
  dataFrom:
    - extract:
        key: secret/coregateway/jwt
        # KV keys land in the Secret the Deployment mounts as files:
        # private_pem        -> JWT_PRIVATE_KEY_FILE
        # prev_private_pem   -> JWT_PREV_PRIVATE_KEY_FILE
        # kid                -> JWT_KID
        # prev_kid           -> JWT_PREV_KID
        # (created_at is metadata for the rotation job; not consumed.)
        # Keep prev_* present but empty outside a rotation: the file paths
        # are fixed, and an empty file means "no rotation in progress".
  # If your ESO version needs explicit remoteRef mapping instead of
  # dataFrom+conversion, use:
  # data:
  #   - secretKey: private_pem
  #     remoteRef: { key: secret/coregateway/jwt, property: private_pem }
  #   - secretKey: kid
  #     remoteRef: { key: secret/coregateway/jwt, property: kid }
  #   - secretKey: prev_private_pem
  #     remoteRef: { key: secret/coregateway/jwt, property: prev_private_pem }
  #   - secretKey: prev_kid
  #     remoteRef: { key: secret/coregateway/jwt, property: prev_kid }
---
# ArgoCD: ESO owns Secret *values*. Tell ArgoCD to ignore value drift
# (annotate the ArgoCD Application accordingly):
#   argocd.argoproj.io/compare-options: IgnoreExtraneous
# Or ignoreDifferences on data/stringData for gateway-jwt-keys.
