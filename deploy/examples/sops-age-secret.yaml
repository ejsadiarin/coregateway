# Flux's sops decryption identity. Create it imperatively and keep it out
# of Git entirely — this file documents the expected shape only.
#
#   age-keygen -o age.agekey
#   kubectl -n flux-system create secret generic sops-age \
#     --from-file=age.agekey=age.agekey
#   # store age.agekey offline (password manager / paper), then shred it
#
# The `sops-age` name and `age.agekey` key are what Flux expects by default;
# `deploy/examples/sops-flux-kustomization.yaml` references it by name.
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
stringData:
  age.agekey: |
    # created by: age-keygen -o age.agekey
    AGE-SECRET-KEY-1REPLACE-WITH-THE-REAL-KEY
