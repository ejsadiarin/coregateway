# Flux's sops decryption identity: the cluster age key. Create it
# imperatively and keep it out of Git entirely; this file documents the
# expected shape only. docs/deploy/homelab-k3s.md section 7 has the full
# procedure, including the second (personal) recipient.
#
#   age-keygen -o cluster.agekey
#   kubectl -n flux-system create secret generic sops-age \
#     --from-file=age.agekey=cluster.agekey
#   # store cluster.agekey in Vaultwarden and on paper, then:
#   shred -u cluster.agekey
#
# The `sops-age` name and `age.agekey` key are what the Flux
# Kustomizations reference (deploy/examples/sops-flux-kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
stringData:
  age.agekey: |
    # created by: age-keygen -o cluster.agekey
    AGE-SECRET-KEY-1REPLACE-WITH-THE-REAL-KEY
