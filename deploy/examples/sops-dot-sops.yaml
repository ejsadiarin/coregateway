---
# .sops.yaml
# Copy to the root of core-infra as `.sops.yaml`; sops looks for it from
# the current directory upward, so run sops from inside the repo. Not a
# Kubernetes manifest; never applied. docs/deploy/homelab-k3s.md section 7.
#
# Convention: every encrypted file ends in `.sops.yaml`. Only data and
# stringData are encrypted, so a PR diff still shows the Secret name and
# the rotation timestamp.
#
# Two recipients: the cluster decrypts with one, you edit with the other.
creation_rules:
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    # age-keygen -y cluster.agekey, then age-keygen -y ~/.config/sops/age/keys.txt
    age: >-
      age1cluster_REPLACE,
      age1personal_REPLACE
