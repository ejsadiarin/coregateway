# The Flux Kustomization that applies core-infra/apps (including
# apps/coregateway) and decrypts its `*.sops.yaml` Secrets at reconcile
# time. docs/deploy/homelab-k3s.md section 8.3 defines it, alongside the
# two infrastructure Kustomizations, which decrypt the same way. Shown here
# for the decryption stanza; don't apply this file as-is.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn: [{name: infra-configs}]
  interval: 10m
  retryInterval: 2m
  prune: true
  path: ./apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypt the files matched by .sops.yaml at the repo root, using the
  # cluster age key in Secret `sops-age`.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Restarts are not configured here: Reloader rolls any Deployment with
  #   reloader.stakater.com/auto: "true"
  # Without it, a changed Secret needs a manual
  #   kubectl -n coregateway rollout restart deploy/coregateway-api
  # because the gateway reads the key file at boot.
