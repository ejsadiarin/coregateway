# Outer ring: downstreams accept ingress ONLY from the gateway identity.
# The internal JWT stays the second (user-delegation) layer.
# Labels and ports match docs/deploy/homelab-k3s.md section 15; copy once
# per downstream (corefinance-api 6969, coredraw-api 6971, coreban-api 6972)
# with its own endpointSelector. Apply with `kubectl apply --dry-run=server`
# first; verify a direct pod-to-corefinance curl drops while gateway traffic
# flows (deploy/README.md section 3). Section 15.7 of the homelab guide has
# the policy the gateway and web pods need once any policy selects them.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: corefinance-api
  namespace: coregateway
spec:
  endpointSelector:
    matchLabels:
      app: corefinance-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: coregateway-api
      toPorts:
        - ports:
            - port: "6969"
              protocol: TCP
  egress:
    # DNS, with the proxy that lets toFQDNs learn addresses.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # The gateway's JWKS, fetched at boot and on an unknown kid.
    - toEndpoints:
        - matchLabels:
            app: coregateway-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Neon, by name rather than by address.
    - toFQDNs:
        - matchPattern: "*.neon.tech"
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Do NOT add a broad toCIDR: 0.0.0.0/0 here. A downstream that calls
    # something else (coreban: ntfy, and the attachment bucket on R2) gets
    # one rule per destination; see homelab guide 15.7.
