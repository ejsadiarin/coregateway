# Patch/snippet: wire the ESO-synced Secret into the gateway Deployment.
# Apply as a strategic-merge patch or fold into your Deployment manifest.
# No PEM material in git — only the Secret *name*.
#
# The key is mounted as a read-only file rather than injected as an env
# var: process environment is readable via `kubectl exec ... /proc/1/environ`
# and shows up in crash dumps. `JWT_PRIVATE_KEY_FILE` wins over the inline
# `JWT_PRIVATE_KEY_PEM` fallback, so the env path stops being used here.
#
# The ExternalSecret materialises all four keys (empty `prev_*` outside a
# rotation), so both files always exist; an empty previous key is treated
# as "no rotation in progress".
#
# Reloader: set the annotation below (or on the ExternalSecret's template)
# so the gateway rolls automatically on every Secret change (i.e. each
# rotation phase). The gateway reads the key at boot, so a new Secret
# value alone does not take effect. TODO: uncomment once Reloader is installed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: coregateway
  # annotations:
  #   reloader.stakater.com/auto: "true"
spec:
  template:
    spec:
      volumes:
        - name: jwt-keys
          secret:
            secretName: gateway-jwt-keys
            defaultMode: 0400
      containers:
        - name: gateway
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/coregateway/jwt
              readOnly: true
          env:
            - name: JWT_PRIVATE_KEY_FILE
              value: /etc/coregateway/jwt/private_pem
            - name: JWT_PREV_PRIVATE_KEY_FILE
              value: /etc/coregateway/jwt/prev_private_pem
            - name: JWT_KID
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt-keys
                  key: kid
            - name: JWT_PREV_KID
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt-keys
                  key: prev_kid
            # JWT_ISSUER / JWT_AUDIENCE / JWT_TTL_SECONDS keep their
            # defaults or come from plain (non-secret) env/config.
