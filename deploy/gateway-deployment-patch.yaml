# Patch/snippet: wire the sops-encrypted `gateway-jwt-keys` Secret into the
# gateway Deployment. docs/deploy/homelab-k3s.md section 15.3 has this
# folded into the full manifest; use this file when building it elsewhere.
# No PEM material in Git except the encrypted `*.sops.yaml` Secret.
#
# The key is mounted as a read-only file rather than injected as an env
# var: process environment is readable via `kubectl exec ... /proc/1/environ`
# and shows up in crash dumps. `JWT_PRIVATE_KEY_FILE` wins over the inline
# `JWT_PRIVATE_KEY_PEM` fallback, so the env path stops being used here.
#
# The Secret always holds all four keys (empty `prev_*` outside a
# rotation), so both files always exist; an empty previous key means
# "no rotation in progress".
#
# Reloader rolls the gateway on every Secret change (each rotation phase).
# The gateway reads the key at boot, so a new Secret value alone does not
# take effect.
#
# defaultMode 0440 with the pod's fsGroup (homelab guide 15.3): the image
# runs as a non-root user that must be able to read the file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coregateway-api
  namespace: coregateway
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  template:
    spec:
      volumes:
        - name: jwt-keys
          secret:
            secretName: gateway-jwt-keys
            defaultMode: 0440
      containers:
        - name: coregateway-api
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/coregateway/jwt
              readOnly: true
          env:
            - name: JWT_PRIVATE_KEY_FILE
              value: /etc/coregateway/jwt/private_pem
            - name: JWT_PREV_PRIVATE_KEY_FILE
              value: /etc/coregateway/jwt/prev_private_pem
            - name: JWT_KID
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt-keys
                  key: kid
            - name: JWT_PREV_KID
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt-keys
                  key: prev_kid
            # JWT_ISSUER / JWT_AUDIENCE / JWT_TTL_SECONDS are plain env
            # (homelab guide 15.3).
