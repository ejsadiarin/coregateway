<!DOCTYPE html>
<html lang="en" class="dark" data-theme="ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CORE System — homelab command center dashboard" />
    <meta name="theme-color" content="#141110" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var t = localStorage.getItem("core-theme");
        if (t === "ember" || t === "abyss" || t === "paper" || t === "mono" || t === "valorant") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet" />
    <title>CORE System</title>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
