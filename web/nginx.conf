server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything (incl. /api/budget/) → coregateway: only it can mint the
    # internal JWT corefinance requires, so budget calls must NOT bypass it.
    location /api/ {
        proxy_pass http://coregateway-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A share from another app is a POST the service worker takes (sw.js).
    # Without one yet (just installed, or its site data cleared) it reaches
    # here: open the share page, which asks for the share again, instead
    # of answering 405.
    location = /share {
        absolute_redirect off;
        if ($request_method = POST) {
            return 303 /share?failed=no-worker;
        }
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
