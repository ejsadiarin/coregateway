---
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # Localhost + tailnet only (no LAN exposure). Update the tailnet IP if it changes (tailscale ip -4).
      - "127.0.0.1:3000:80"
      - "100.119.212.55:3000:80"
    depends_on:
      - coregateway-api
      - corefinance-api

  coregateway-api:
    build:
      context: .
      dockerfile: Dockerfile.coregateway-api
    ports:
      - "127.0.0.1:8080:8080"
      - "100.119.212.55:8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATION_URL=${MIGRATION_URL}
      - PORT=8080
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://100.119.212.55:3000
      - COREFINANCE_URL=http://corefinance-api:6969
      - COREDRAW_URL=http://coredraw-api:6971
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_KID=${JWT_KID:-2026-09-a}
      - JWT_ISSUER=${JWT_ISSUER:-https://gateway.internal}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-corefinance,coredraw}
      - JWT_TTL_SECONDS=${JWT_TTL_SECONDS:-300}
      - JWT_PRIVATE_KEY_PEM=${JWT_PRIVATE_KEY_PEM:-}
      - JWT_PREV_PRIVATE_KEY_PEM=${JWT_PREV_PRIVATE_KEY_PEM:-}
      - JWT_PREV_KID=${JWT_PREV_KID:-}
      # Native (no-compose) runs offset the ports so they can coexist with this
      # stack: gateway :18080, coredraw-api :16971, web :3001. Downstreams must
      # then verify against http://localhost:18080/.well-known/jwks.json instead
      # of http://coregateway-api:8080/.well-known/jwks.json (that override lives
      # in the coredraw-api service below and in services/coredraw/.env).
      - GODEBUG=netdns=go
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/.well-known/jwks.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  corefinance-api:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-api
      target: api
    ports:
      # Not needed outside this machine (gateway reaches it by service name).
      - "127.0.0.1:6969:6969"
    env_file:
      - ./services/corefinance/.env
    environment:
      - PORT=6969
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      coregateway-api:
        condition: service_healthy

  coredraw-api:
    build:
      context: ./services/coredraw
      dockerfile: Dockerfile.coredraw-api
      target: api
    ports:
      # Not needed outside this machine (gateway reaches it by service name).
      - "127.0.0.1:6971:6971"
    env_file:
      - ./services/coredraw/.env
    environment:
      - PORT=6971
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      coregateway-api:
        condition: service_healthy

  corefinance-cron-worker:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-cron-worker
      target: worker
    env_file:
      - ./services/corefinance/.env
    environment:
      - GODEBUG=netdns=go
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
