---
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - coregateway-api
      - corefinance-api
    environment:
      - VITE_API_URL=http://localhost:8080

  coregateway-api:
    build:
      context: .
      dockerfile: Dockerfile.coregateway-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - COREFINANCE_URL=http://corefinance-api:6969
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GODEBUG=netdns=go
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  corefinance-api:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-api
      target: api
    ports:
      - "6969:6969"
    env_file:
      - ./services/corefinance/.env
    environment:
      - PORT=6969
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  corefinance-cron-worker:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-cron-worker
      target: worker
    env_file:
      - ./services/corefinance/.env
    environment:
      - GODEBUG=netdns=go
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
