---
secrets:
  # Signing key mounted as a file: process environment is readable via
  # `docker inspect` and /proc, so the PEM never travels as an env var.
  # Generate with: openssl genpkey -algorithm ed25519 -out jwt_ed25519.pem
  # Compose mounts the file with its host owner and mode, and the gateway runs
  # as UID/GID 10001 (Dockerfile.coregateway-api), so let that group read it:
  #   sudo chgrp 10001 jwt_ed25519.pem && chmod 640 jwt_ed25519.pem
  jwt_private_key:
    file: ./jwt_ed25519.pem

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # Localhost + tailnet only (no LAN exposure). TAILSCALE_IP is this host's
      # tailnet IP; `make stack-up` sets it from `tailscale ip -4`. Unset, the
      # second binding falls back to 127.0.0.2, another loopback address, so a
      # plain `docker compose` still works and still never reaches the LAN.
      - "127.0.0.1:3000:80"
      - "${TAILSCALE_IP:-127.0.0.2}:3000:80"
    # HTTPS on the tailnet through the homelab Traefik (~/services/traefik),
    # which holds the *.local.ejsadiarin.com wildcard cert. The PWA needs a
    # secure origin: service worker, install, and the Android share target.
    labels:
      - traefik.enable=true
      - traefik.http.routers.core.entrypoints=https
      - traefik.http.routers.core.rule=Host(`core.local.ejsadiarin.com`)
      - traefik.http.routers.core.tls=true
      - traefik.http.services.core.loadbalancer.server.port=80
      - traefik.docker.network=proxy
    networks:
      - default
      - proxy
    depends_on:
      - coregateway-api
      - corefinance-api

  coregateway-api:
    build:
      context: .
      dockerfile: Dockerfile.coregateway-api
    ports:
      - "127.0.0.1:8080:8080"
      - "${TAILSCALE_IP:-127.0.0.2}:8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATION_URL=${MIGRATION_URL}
      - PORT=8080
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://${TAILSCALE_IP:-127.0.0.2}:3000
      - COREFINANCE_URL=http://corefinance-api:6969
      - COREDRAW_URL=http://coredraw-api:6971
      - COREBAN_URL=http://coreban-api:6972
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_KID=${JWT_KID:-2026-09-a}
      - JWT_ISSUER=${JWT_ISSUER:-https://gateway.internal}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-corefinance,coredraw,coreban}
      - JWT_TTL_SECONDS=${JWT_TTL_SECONDS:-300}
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private_key
      # Rotation-only: the previous key still travels inline. Prefer a second
      # secret file + JWT_PREV_PRIVATE_KEY_FILE if you rotate under compose.
      - JWT_PREV_PRIVATE_KEY_PEM=${JWT_PREV_PRIVATE_KEY_PEM:-}
      - JWT_PREV_KID=${JWT_PREV_KID:-}
      # Native (no-compose) runs offset the ports so they can coexist with this
      # stack: gateway :18080, coredraw-api :16971, web :3001. Downstreams must
      # then verify against http://localhost:18080/.well-known/jwks.json instead
      # of http://coregateway-api:8080/.well-known/jwks.json (that override lives
      # in the coredraw-api service below and in services/coredraw/.env).
      - GODEBUG=netdns=go
    secrets:
      - jwt_private_key
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/.well-known/jwks.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  corefinance-api:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-api
      target: api
    ports:
      # Not needed outside this machine (gateway reaches it by service name).
      - "127.0.0.1:6969:6969"
    env_file:
      - ./services/corefinance/.env
    environment:
      - PORT=6969
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      coregateway-api:
        condition: service_healthy

  coredraw-api:
    build:
      context: ./services/coredraw
      dockerfile: Dockerfile.coredraw-api
      target: api
    ports:
      # Not needed outside this machine (gateway reaches it by service name).
      - "127.0.0.1:6971:6971"
    env_file:
      - ./services/coredraw/.env
    environment:
      - PORT=6971
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      coregateway-api:
        condition: service_healthy

  coreban-api:
    build:
      context: ./services/coreban
      dockerfile: Dockerfile.coreban-api
      target: api
    ports:
      # Not needed outside this machine (gateway reaches it by service name).
      - "127.0.0.1:6972:6972"
    env_file:
      - ./services/coreban/.env
    environment:
      - PORT=6972
      - GODEBUG=netdns=go
      # Dev override: reach the gateway by compose service name over plain HTTP.
      - JWT_JWKS_URL=http://coregateway-api:8080/.well-known/jwks.json
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      coregateway-api:
        condition: service_healthy

  corefinance-cron-worker:
    build:
      context: ./services/corefinance
      dockerfile: Dockerfile.corefinance-cron-worker
      target: worker
    env_file:
      - ./services/corefinance/.env
    environment:
      - GODEBUG=netdns=go
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

networks:
  # Traefik's network, created by the homelab Traefik stack.
  proxy:
    external: true
